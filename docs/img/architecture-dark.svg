<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Architecture: VS Code Copilot Chat talks over MCP to this server, which bridges to Microsoft Foundry, Microsoft's Power BI modeling MCP server, and the Fabric REST API.">
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker></defs>
<rect width="960" height="500" fill="#0d1117"/>
<rect x="20" y="208" width="196" height="84" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="118" y="240" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">VS Code</text>
<text x="118" y="261" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">GitHub Copilot Chat</text>
<text x="118" y="281" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">the user is already here</text>
<path d="M 216 250 L 281 250" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<text x="253" y="242" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle">MCP</text>
<text x="253" y="268" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle">stdio</text>
<rect x="290" y="118" width="250" height="264" rx="12" fill="#2a1a10" stroke="#a04b12" stroke-width="2"/>
<text x="415" y="150" fill="#f0883e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700" text-anchor="middle">foundry-copilot-mcp</text>
<text x="415" y="170" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">this repo &#183; ~400 lines</text>
<line x1="312" y1="184" x2="518" y2="184" stroke="#a04b12" stroke-width="1"/>
<circle cx="332" cy="210" r="10" fill="#f0883e"/><text x="332" y="214" fill="#0d1117" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="352" y="214" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Foundry bridge</text>
<circle cx="332" cy="270" r="10" fill="#f0883e"/><text x="332" y="274" fill="#0d1117" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="352" y="274" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start">MCP client</text>
<circle cx="332" cy="330" r="10" fill="#f0883e"/><text x="332" y="334" fill="#0d1117" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="352" y="334" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Fabric REST</text>
<rect x="620" y="60" width="320" height="96" rx="10" fill="#101d2f" stroke="#1f4d8f" stroke-width="1.5"/>
<text x="636" y="88" fill="#4493f8" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Microsoft Foundry</text>
<text x="636" y="110" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">your agent &#8212; instructions, tools and</text>
<text x="636" y="128" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">model deployment all stay server-side</text>
<text x="636" y="146" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start">get_openai_client&#40;agent_name=&#8230;&#41;</text>
<rect x="620" y="190" width="320" height="120" rx="10" fill="#101d2f" stroke="#1f4d8f" stroke-width="1.5"/>
<text x="636" y="218" fill="#4493f8" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Power BI modeling MCP</text>
<text x="636" y="240" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Microsoft&#39;s own server, launched as a</text>
<text x="636" y="258" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">child process &#8212; read-only by default</text>
<line x1="636" y1="272" x2="924" y2="272" stroke="#1f4d8f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="636" y="292" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">&#8594;  Fabric / Power BI  &#40;XMLA, as the user&#41;</text>
<rect x="620" y="344" width="320" height="96" rx="10" fill="#101d2f" stroke="#1f4d8f" stroke-width="1.5"/>
<text x="636" y="372" fill="#4493f8" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Fabric REST API</text>
<text x="636" y="394" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">turns the GUIDs in a Fabric URL into</text>
<text x="636" y="412" fill="#e6edf3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">the display names the tools need</text>
<text x="636" y="430" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start">GET /v1/workspaces/&#123;id&#125;</text>
<path d="M 540 210 C 580.0 210, 580.0 108, 611 108" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 540 270 C 580.0 270, 580.0 250, 611 250" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 540 330 C 580.0 330, 580.0 392, 611 392" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="20" y1="462" x2="940" y2="462" stroke="#3d444d" stroke-width="1"/>
<text x="20" y="484" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Every call runs as the signed-in user, never a service principal &#8212; so row-level security applies.</text>
</svg>